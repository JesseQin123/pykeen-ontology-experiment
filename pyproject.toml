[project]
name = "kge-validation"
version = "0.1.0"
description = "Does PyKEEN-style graph embedding actually help on semantic ontology graphs? Accuracy, scale, cross-ontology alignment."
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gensim>=4.4.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pot>=0.9.7.post1",
    "pykeen>=1.11.1",
    "rdflib>=7.6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]
